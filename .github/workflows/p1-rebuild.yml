name: P1 rebuild validation

on:
  pull_request:
    branches: [main]
    paths:
      - "actor/**"
      - "matter/**"
      - "construct/**"
      - "space/**"
      - "p1/**"
      - "tests/p1_*.gd"
      - "project.godot"
      - ".github/workflows/p1-rebuild.yml"
  workflow_dispatch:

concurrency:
  group: p1-rebuild-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p1-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Parse/import project
        run: godot --headless --path . --editor --quit

      - name: Run P1 volumetric actor challenger
        run: godot --headless --path . --script res://tests/p1_volumetric_actor_challenger.gd

      - name: Run P1 composed scene foundation smoke
        run: godot --headless --path . --script res://tests/p1_scene_foundation_smoke.gd

      - name: Run P1 multi-Space registry probe
        run: godot --headless --path . --script res://tests/p1_space_registry_probe.gd

      - name: Run P1 live topology consumer probe
        run: godot --headless --path . --script res://tests/p1_live_topology_consumer_probe.gd

      - name: Run P1 storage rebase probe
        run: godot --headless --path . --script res://tests/p1_storage_rebase_probe.gd
