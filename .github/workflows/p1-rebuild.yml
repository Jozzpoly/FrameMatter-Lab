name: P1 rebuild validation

on:
  pull_request:
    branches: [main]
    paths:
      - "actor/**"
      - "matter/**"
      - "construct/**"
      - "space/**"
      - "p1/**"
      - "tests/p1_*.gd"
      - "project.godot"
      - ".github/workflows/p1-rebuild.yml"
  workflow_dispatch:

jobs:
  p1-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Parse/import project
        run: godot --headless --path . --editor --quit

      - name: Run P1 volumetric actor challenger
        run: godot --headless --path . --script res://tests/p1_volumetric_actor_challenger.gd

      - name: Run P1 composed scene foundation smoke
        run: godot --headless --path . --script res://tests/p1_scene_foundation_smoke.gd
