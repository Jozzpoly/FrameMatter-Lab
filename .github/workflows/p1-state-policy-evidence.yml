name: P1 R-V3a state policy evidence

on:
  push:
    branches: [rebuild/p1-interactive-foundation]
    paths:
      - "tests/p1_state_policy_visual_capture.gd"
      - "ci/run_godot_state_policy_capture.ps1"
      - ".github/workflows/p1-state-policy-evidence.yml"
      - "p1/matter_state_presentation.gd"
      - "p1/matter_surface_grid.gd"
      - "p1/main.gd"
      - "p1/main.tscn"
      - "matter/**"
      - "construct/**"
      - "space/**"
      - "project.godot"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p1-state-policy-evidence.yml"
      - "tests/p1_state_policy_visual_capture.gd"
      - "ci/run_godot_state_policy_capture.ps1"
  workflow_dispatch:

concurrency:
  group: p1-rv3a-state-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-forward-plus-state-policy:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [current_contour, top_crown]
    env:
      P1_STATE_POLICY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      P1_STATE_POLICY_VARIANT: ${{ matrix.variant }}
      P1_STATE_POLICY_EVIDENCE_DIR: ${{ github.workspace }}\\artifacts\\p1-state-policy\\${{ matrix.variant }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.P1_STATE_POLICY_SOURCE_SHA }}

      - name: Verify exact source checkout
        shell: pwsh
        run: |
          $checkedOut = (git rev-parse HEAD).Trim()
          if ($checkedOut -ne $env:P1_STATE_POLICY_SOURCE_SHA) {
            throw "R-V3a checkout mismatch: expected $env:P1_STATE_POLICY_SOURCE_SHA, got $checkedOut"
          }
          "R-V3a exact source checkout: $checkedOut"
          "R-V3a variant: $env:P1_STATE_POLICY_VARIANT"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Strict synchronous project import
        shell: pwsh
        run: ./ci/run_godot_import.ps1

      - name: Capture real state-policy sequence
        shell: pwsh
        run: ./ci/run_godot_state_policy_capture.ps1 -OutputDir $env:P1_STATE_POLICY_EVIDENCE_DIR -Variant $env:P1_STATE_POLICY_VARIANT

      - name: Record R-V3a evidence provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:P1_STATE_POLICY_EVIDENCE_DIR | Out-Null
          $checkedOut = (git rev-parse HEAD).Trim()
          @"
          FrameMatter P1 R-V3a state presentation policy challenger
          workflow_run=$env:GITHUB_RUN_ID
          source_commit=$env:P1_STATE_POLICY_SOURCE_SHA
          checked_out_commit=$checkedOut
          event_commit=$env:GITHUB_SHA
          variant=$env:P1_STATE_POLICY_VARIANT
          platform=windows-latest
          renderer=Godot 4.7.2 Forward+ / D3D12
          source_scene=res://p1/main.tscn
          capture_script=res://tests/p1_state_policy_visual_capture.gd
          sequence=STATIC focused -> DYNAMIC focused -> split two DYNAMIC successors -> freeze focused successor beside DYNAMIC sibling -> low-angle mixed-state stress
          promotion=none; rendered challenger evidence only
          "@ | Set-Content -Path (Join-Path $env:P1_STATE_POLICY_EVIDENCE_DIR "STATE-POLICY-EVIDENCE-INFO.txt")

      - name: Upload R-V3a evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameMatter-P1-RV3a-StatePolicy-${{ matrix.variant }}
          path: artifacts/p1-state-policy/${{ matrix.variant }}
          retention-days: 30
          if-no-files-found: warn
