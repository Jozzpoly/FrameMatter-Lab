name: Deliver P1 Owner Candidate

# Owner delivery is intentionally manual while the P1 Owner-facing recovery
# campaign is active. Mechanical green is no longer sufficient to produce an
# Owner candidate. Re-enable automatic delivery only after G8 rendered preflight.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "p1-owner-candidate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Validate + build P1 Owner candidate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Strict project import
        run: bash ci/run_godot_import.sh

      - name: Compile P1 dependency graph
        run: bash ci/run_godot_probe.sh res://tests/p1_compile_gate.gd P1_COMPILE_GATE_PASS

      - name: Verify canonical P1 startup
        run: bash ci/run_godot_probe.sh res://tests/p1_canonical_startup_smoke.gd P1_CANONICAL_STARTUP_PASS

      - name: Verify P1 volumetric actor
        run: bash ci/run_godot_probe.sh res://tests/p1_volumetric_actor_challenger.gd P1_VOLUMETRIC_ACTOR_PASS

      - name: Verify P1 composed scene foundation
        run: bash ci/run_godot_probe.sh res://tests/p1_scene_foundation_smoke.gd P1_SCENE_FOUNDATION_PASS

      - name: Verify P1 multi-Space registry
        run: bash ci/run_godot_probe.sh res://tests/p1_space_registry_probe.gd P1_SPACE_REGISTRY_PASS

      - name: Verify P1 live topology consumer
        run: bash ci/run_godot_probe.sh res://tests/p1_live_topology_consumer_probe.gd P1_LIVE_TOPOLOGY_PASS

      - name: Verify P1 storage rebase
        run: bash ci/run_godot_probe.sh res://tests/p1_storage_rebase_probe.gd P1_STORAGE_REBASE_PASS

      - name: Verify actor/camera storage-frame continuity
        run: bash ci/run_godot_probe.sh res://tests/p1_storage_actor_context_challenger.gd P1_STORAGE_ACTOR_CONTEXT_PASS

      - name: Verify finite Space control
        run: bash ci/run_godot_probe.sh res://tests/p1_finite_space_control_probe.gd P1_FINITE_CONTROL_PASS

      - name: Verify integrated P1 causal loop
        run: bash ci/run_godot_probe.sh res://tests/p1_integrated_causal_loop_probe.gd P1_INTEGRATED_CAUSAL_LOOP_PASS

      - name: Export browser candidate
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          touch build/web/.nojekyll

      - name: Export Windows candidate
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/FrameMatter-P1-Owner-Candidate.exe
          test -f build/windows/FrameMatter-P1-Owner-Candidate.exe

      - name: Record candidate provenance
        run: |
          cat > build/P1-BUILD-INFO.txt <<EOF
          FrameMatter P1 Owner Candidate
          commit=${GITHUB_SHA}
          workflow_run=${GITHUB_RUN_ID}
          godot=4.7.2
          branch_or_ref=${GITHUB_REF}
          canonical_main_scene=res://p1/main.tscn
          strict_integrated_gate=P1_INTEGRATED_CAUSAL_LOOP_PASS
          delivery_policy=manual_after_G8_rendered_preflight
          EOF
          cp build/P1-BUILD-INFO.txt build/web/P1-BUILD-INFO.txt
          cp build/P1-BUILD-INFO.txt build/windows/P1-BUILD-INFO.txt

      - name: Upload browser candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameMatter-P1-Web
          path: build/web
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameMatter-P1-Windows
          path: build/windows
          if-no-files-found: error
          retention-days: 30

      - name: Delivery summary
        run: |
          echo "P1 strict dependency graph PASS"
          echo "P1 canonical startup PASS"
          echo "P1 bounded/integrated runtime suite PASS"
          echo "P1 integrated causal loop PASS"
          echo "Manual delivery policy: G8 rendered preflight required before Owner use"
          echo "Browser export PASS"
          echo "Windows export PASS"
          echo "Artifacts: FrameMatter-P1-Web and FrameMatter-P1-Windows"
