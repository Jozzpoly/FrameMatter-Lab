name: P1 G6 world causality evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "p1/**"
      - "matter/**"
      - "construct/**"
      - "actor/**"
      - "space/**"
      - "tests/p1_world_causality_visual_capture.gd"
      - "ci/run_godot_world_causality_capture.ps1"
      - "project.godot"
      - ".github/workflows/p1-world-causality-evidence.yml"
  workflow_dispatch:

concurrency:
  group: p1-g6-world-causality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-forward-plus-world-causality:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, coarse_grid]
    env:
      P1_WORLD_CAUSALITY_VARIANT: ${{ matrix.variant }}
      P1_WORLD_CAUSALITY_EVIDENCE_DIR: ${{ github.workspace }}\artifacts\p1-world-causality-evidence\${{ matrix.variant }}
      P1_WORLD_CAUSALITY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.P1_WORLD_CAUSALITY_SOURCE_SHA }}

      - name: Verify exact source checkout
        shell: pwsh
        run: |
          $checkedOut = (git rev-parse HEAD).Trim()
          if ($checkedOut -ne $env:P1_WORLD_CAUSALITY_SOURCE_SHA) {
            throw "G6 evidence checkout mismatch: expected $env:P1_WORLD_CAUSALITY_SOURCE_SHA, got $checkedOut"
          }
          "G6 exact source checkout: $checkedOut"
          "G6 world-reference variant: $env:P1_WORLD_CAUSALITY_VARIANT"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Strict synchronous project import
        shell: pwsh
        run: ./ci/run_godot_import.ps1

      - name: Capture G6 world causality evidence
        shell: pwsh
        run: ./ci/run_godot_world_causality_capture.ps1 -OutputDir $env:P1_WORLD_CAUSALITY_EVIDENCE_DIR

      - name: Record G6 evidence provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:P1_WORLD_CAUSALITY_EVIDENCE_DIR | Out-Null
          $checkedOut = (git rev-parse HEAD).Trim()
          @"
          FrameMatter P1 G6 world causality evidence
          workflow_run=$env:GITHUB_RUN_ID
          source_commit=$env:P1_WORLD_CAUSALITY_SOURCE_SHA
          checked_out_commit=$checkedOut
          event_commit=$env:GITHUB_SHA
          platform=windows-latest
          renderer=Godot 4.7.2 Forward+ / D3D12
          source_scene=res://p1/main.tscn
          capture_script=res://tests/p1_world_causality_visual_capture.gd
          world_reference_variant=$env:P1_WORLD_CAUSALITY_VARIANT
          evidence_scope=zero-launch release / finite translation+yaw / topology split / one-successor impulse / freeze-at-pose / dynamic sibling continuation
          "@ | Set-Content -Path (Join-Path $env:P1_WORLD_CAUSALITY_EVIDENCE_DIR "WORLD-CAUSALITY-EVIDENCE-INFO.txt")

      - name: Upload G6 world causality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameMatter-P1-G6-World-Causality-Windows-${{ matrix.variant }}
          path: artifacts/p1-world-causality-evidence/${{ matrix.variant }}
          retention-days: 30
          if-no-files-found: warn
