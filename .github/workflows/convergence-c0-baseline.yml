name: Convergence C0 exact-artifact baseline

on:
  push:
    branches:
      - research/convergence-c0-baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convergence-c0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-artifact-baseline:
    name: Prove Spark in exact exported executable
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
      OUTPUT_DIR: artifacts/convergence-c0

    steps:
      - name: Checkout exact C0 source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Prove exact source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "C0 checkout mismatch: expected $env:SOURCE_SHA, got $actual"
          }
          "C0_SOURCE_PASS: $actual"

      - name: Setup Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Strict Windows import
        shell: pwsh
        run: ./ci/run_godot_import.ps1

      - name: Compile recovery dependency graph
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/p1_compile_gate.gd -PassMarker P1_COMPILE_GATE_PASS

      - name: Rehearse source-level causal Spark
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/w0d_recovery_causal_loop_probe.gd -PassMarker W0D_RECOVERY_CAUSAL_LOOP_PASS

      - name: Export exact Windows C0 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUTPUT_DIR | Out-Null
          $godotExecutable = (Get-Command godot -ErrorAction Stop).Source
          $outputPath = "$env:OUTPUT_DIR/FrameMatter-Convergence-C0.exe"
          $stdoutFile = [System.IO.Path]::GetTempFileName()
          $stderrFile = [System.IO.Path]::GetTempFileName()
          try {
            $argumentLine = "--headless --path . --export-release `"Windows Desktop`" `"$outputPath`""
            $process = Start-Process `
              -FilePath $godotExecutable `
              -ArgumentList $argumentLine `
              -NoNewWindow `
              -Wait `
              -PassThru `
              -RedirectStandardOutput $stdoutFile `
              -RedirectStandardError $stderrFile
            $stdout = Get-Content -Path $stdoutFile -Raw -ErrorAction SilentlyContinue
            $stderr = Get-Content -Path $stderrFile -Raw -ErrorAction SilentlyContinue
            Write-Host ($stdout + [Environment]::NewLine + $stderr)
            if ($process.ExitCode -ne 0) {
              throw "Godot C0 export exited with status $($process.ExitCode)"
            }
          }
          finally {
            Remove-Item -Path $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $outputPath)) { throw "C0 executable missing after export: $outputPath" }
          if ((Get-Item $outputPath).Length -lt 1000000) { throw "C0 executable is implausibly small" }

      - name: Run exact exported Spark qualification
        shell: pwsh
        run: |
          $exe = Join-Path $env:OUTPUT_DIR "FrameMatter-Convergence-C0.exe"
          $stdoutFile = [System.IO.Path]::GetTempFileName()
          $stderrFile = [System.IO.Path]::GetTempFileName()
          try {
            $argumentLine = "--headless -- --c0-artifact-baseline"
            $process = Start-Process `
              -FilePath $exe `
              -ArgumentList $argumentLine `
              -NoNewWindow `
              -Wait `
              -PassThru `
              -RedirectStandardOutput $stdoutFile `
              -RedirectStandardError $stderrFile
            $stdout = Get-Content -Path $stdoutFile -Raw -ErrorAction SilentlyContinue
            $stderr = Get-Content -Path $stderrFile -Raw -ErrorAction SilentlyContinue
            $combined = $stdout + [Environment]::NewLine + $stderr
            Write-Host $combined
            if ($process.ExitCode -ne 0) {
              throw "Exact exported C0 qualification exited with status $($process.ExitCode)"
            }
            if ($combined -notmatch "C0_EXPORTED_SPARK_BASELINE_PASS") {
              throw "Exact exported C0 qualification did not emit PASS marker"
            }
          }
          finally {
            Remove-Item -Path $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          }

      - name: Record exact C0 provenance
        shell: pwsh
        run: |
          $exe = Join-Path $env:OUTPUT_DIR "FrameMatter-Convergence-C0.exe"
          $digest = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          FrameMatter Convergence C0
          source_commit=$env:SOURCE_SHA
          workflow_run=$env:GITHUB_RUN_ID
          godot=4.7.2
          platform=windows-latest
          main_scene=res://p1/recovery_main.tscn
          executable_sha256=$digest
          exact_artifact_spark=PASS
          scope=C0_BASELINE_NOT_OWNER_SPARK_GATE
          "@ | Set-Content -Path (Join-Path $env:OUTPUT_DIR "C0-PROVENANCE.txt")
          "C0_ARTIFACT_SHA256: $digest"

      - name: Upload C0 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameMatter-Convergence-C0-Windows
          path: artifacts/convergence-c0
          if-no-files-found: error
          retention-days: 14
