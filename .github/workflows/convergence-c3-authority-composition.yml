name: Convergence C3 authority composition

on:
  push:
    branches:
      - research/convergence-c3-authority-composition
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convergence-c3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority-composition:
    name: Qualify C3 and preserve exact-artifact Spark
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
      OUTPUT_DIR: artifacts/convergence-c3

    steps:
      - name: Checkout exact C3 source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Prove exact source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "C3 checkout mismatch: expected $env:SOURCE_SHA, got $actual" }
          "C3_SOURCE_PASS: $actual"

      - name: Setup Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Strict Windows import
        shell: pwsh
        run: ./ci/run_godot_import.ps1

      - name: Compile recovery dependency graph
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/p1_compile_gate.gd -PassMarker P1_COMPILE_GATE_PASS

      - name: Preserve C2 structural law
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/c2_structural_law_probe.gd -PassMarker C2_STRUCTURAL_LAW_PASS

      - name: Qualify C3 authority composition
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/c3_authority_composition_probe.gd -PassMarker C3_AUTHORITY_COMPOSITION_PASS

      - name: Preserve source-level causal Spark
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/w0d_recovery_causal_loop_probe.gd -PassMarker W0D_RECOVERY_CAUSAL_LOOP_PASS

      - name: Export exact Windows C3 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUTPUT_DIR | Out-Null
          $godotExecutable = (Get-Command godot -ErrorAction Stop).Source
          $outputPath = "$env:OUTPUT_DIR/FrameMatter-Convergence-C3.exe"
          $stdoutFile = [System.IO.Path]::GetTempFileName()
          $stderrFile = [System.IO.Path]::GetTempFileName()
          try {
            $argumentLine = "--headless --path . --export-release `"Windows Desktop`" `"$outputPath`""
            $process = Start-Process `
              -FilePath $godotExecutable `
              -ArgumentList $argumentLine `
              -NoNewWindow `
              -Wait `
              -PassThru `
              -RedirectStandardOutput $stdoutFile `
              -RedirectStandardError $stderrFile
            $stdout = Get-Content -Path $stdoutFile -Raw -ErrorAction SilentlyContinue
            $stderr = Get-Content -Path $stderrFile -Raw -ErrorAction SilentlyContinue
            Write-Host ($stdout + [Environment]::NewLine + $stderr)
            if ($process.ExitCode -ne 0) { throw "Godot C3 export exited with status $($process.ExitCode)" }
          }
          finally {
            Remove-Item -Path $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $outputPath)) { throw "C3 executable missing after export: $outputPath" }
          if ((Get-Item $outputPath).Length -lt 1000000) { throw "C3 executable is implausibly small" }

      - name: Re-prove C0 Spark in exact C3 executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:OUTPUT_DIR "FrameMatter-Convergence-C3.exe"
          $stdoutFile = [System.IO.Path]::GetTempFileName()
          $stderrFile = [System.IO.Path]::GetTempFileName()
          try {
            $process = Start-Process `
              -FilePath $exe `
              -ArgumentList "--headless -- --c0-artifact-baseline" `
              -NoNewWindow `
              -Wait `
              -PassThru `
              -RedirectStandardOutput $stdoutFile `
              -RedirectStandardError $stderrFile
            $combined = (Get-Content -Path $stdoutFile -Raw -ErrorAction SilentlyContinue) + [Environment]::NewLine + (Get-Content -Path $stderrFile -Raw -ErrorAction SilentlyContinue)
            Write-Host $combined
            if ($process.ExitCode -ne 0) { throw "Exact C3 executable failed C0 qualification with status $($process.ExitCode)" }
            if ($combined -notmatch "C0_EXPORTED_SPARK_BASELINE_PASS") { throw "Exact C3 executable did not preserve C0 PASS" }
          }
          finally {
            Remove-Item -Path $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          }

      - name: Record bounded qualification
        shell: pwsh
        run: |
          $exe = Join-Path $env:OUTPUT_DIR "FrameMatter-Convergence-C3.exe"
          $digest = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "C3_EXACT_ARTIFACT_SHA256: $digest"
          "C3_SCOPE: STRUCTURAL_LAW_TO_AUTHORITY_COMPOSITION_NO_PASSIVE_RELATION_NO_JOINT"
