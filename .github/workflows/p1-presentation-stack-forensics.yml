name: P1 presentation stack forensics

on:
  pull_request:
    branches: [main]
    paths:
      - "matter/**"
      - "construct/**"
      - "p1/**"
      - "tests/p1_presentation_stack_forensics_capture.gd"
      - "ci/run_godot_presentation_stack_forensics.ps1"
      - "project.godot"
      - ".github/workflows/p1-presentation-stack-forensics.yml"
  workflow_dispatch:

concurrency:
  group: p1-presentation-stack-forensics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-forward-plus-presentation-stack:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [base, grid, state, grid_state]
    env:
      P1_PRESENTATION_STACK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      P1_PRESENTATION_STACK_VARIANT: ${{ matrix.variant }}
      P1_PRESENTATION_STACK_EVIDENCE_DIR: ${{ github.workspace }}\artifacts\p1-presentation-stack\${{ matrix.variant }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.P1_PRESENTATION_STACK_SOURCE_SHA }}

      - name: Verify exact source checkout
        shell: pwsh
        run: |
          $checkedOut = (git rev-parse HEAD).Trim()
          if ($checkedOut -ne $env:P1_PRESENTATION_STACK_SOURCE_SHA) {
            throw "Presentation-stack checkout mismatch: expected $env:P1_PRESENTATION_STACK_SOURCE_SHA, got $checkedOut"
          }
          "Presentation-stack exact source checkout: $checkedOut"
          "Presentation-stack variant: $env:P1_PRESENTATION_STACK_VARIANT"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Strict synchronous project import
        shell: pwsh
        run: ./ci/run_godot_import.ps1

      - name: Capture corrected-surface presentation stack
        shell: pwsh
        run: ./ci/run_godot_presentation_stack_forensics.ps1 -OutputDir $env:P1_PRESENTATION_STACK_EVIDENCE_DIR -Variant $env:P1_PRESENTATION_STACK_VARIANT

      - name: Record presentation-stack provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:P1_PRESENTATION_STACK_EVIDENCE_DIR | Out-Null
          $checkedOut = (git rev-parse HEAD).Trim()
          @"
          FrameMatter P1 corrected-surface presentation stack forensics
          workflow_run=$env:GITHUB_RUN_ID
          source_commit=$env:P1_PRESENTATION_STACK_SOURCE_SHA
          checked_out_commit=$checkedOut
          event_commit=$env:GITHUB_SHA
          platform=windows-latest
          renderer=Godot 4.7.2 Forward+ / D3D12
          source_scene=res://p1/main.tscn
          capture_script=res://tests/p1_presentation_stack_forensics_capture.gd
          variant=$env:P1_PRESENTATION_STACK_VARIANT
          geometry=canonical clean + deterministic accumulated chaotic edits
          unrelated_instrumentation=player hidden / HUD hidden / origin marker hidden
          "@ | Set-Content -Path (Join-Path $env:P1_PRESENTATION_STACK_EVIDENCE_DIR "PRESENTATION-STACK-EVIDENCE-INFO.txt")

      - name: Upload presentation-stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameMatter-P1-Presentation-Stack-${{ matrix.variant }}
          path: artifacts/p1-presentation-stack/${{ matrix.variant }}
          retention-days: 30
          if-no-files-found: warn
