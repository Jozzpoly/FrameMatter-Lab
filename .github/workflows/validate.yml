name: Validate research harness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  research-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Parse/import project
        run: godot --headless --path . --editor --quit

      - name: Run G0 smoke test
        run: godot --headless --path . --script res://tests/g0_smoke.gd

      - name: Run G0 campaign
        run: godot --headless --path . --script res://tests/g0_campaign.gd

      - name: Run G1 dynamic construct smoke test
        run: godot --headless --path . --script res://tests/g1_dynamic_construct.gd

      - name: Run G1 campaign
        run: godot --headless --path . --script res://tests/g1_campaign.gd

      - name: Run G2 live mutation smoke test
        run: godot --headless --path . --script res://tests/g2_live_mutation.gd

      - name: Run G2 mutation campaign
        run: godot --headless --path . --script res://tests/g2_campaign.gd

      - name: Run G3 stock CharacterBody3D controlled-platform probe
        run: godot --headless --path . --script res://tests/g3_baseline_probe.gd

      - name: Run G3 free-dynamic contact probe
        run: godot --headless --path . --script res://tests/g3_dynamic_contact_probe.gd

      - name: Run G3 frame-aware query controller challenger
        run: godot --headless --path . --script res://tests/g3_frame_challenger.gd

      - name: Run G3 frame-aware campaign
        run: godot --headless --path . --script res://tests/g3_frame_campaign.gd

      - name: Run topology split probe
        run: godot --headless --path . --script res://tests/topology_split_probe.gd

      - name: Run topology actor split probe
        run: godot --headless --path . --script res://tests/topology_actor_split_probe.gd

      - name: Run topology rebased split probe
        run: godot --headless --path . --script res://tests/topology_rebased_split_probe.gd
