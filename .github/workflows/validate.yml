name: Validate research harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: research-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-campaign-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Strict import / compile gate
        run: bash ci/run_godot_import.sh

      - name: Run historical interactive regression controls
        run: |
          set -e
          for script in \
            tests/lab_lifecycle_smoke.gd \
            tests/p0_interactive_lab_smoke.gd
          do
            bash ci/run_godot_clean.sh "res://$script"
          done

  fast-invariant-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Strict import / compile gate
        run: bash ci/run_godot_import.sh

      - name: Run defended fast invariant set
        run: |
          set -e
          for script in \
            tests/g0_smoke.gd \
            tests/g1_dynamic_construct.gd \
            tests/g2_live_mutation.gd \
            tests/lifecycle_freeze_semantics_probe.gd \
            tests/lifecycle_provider_replacement_probe.gd \
            tests/lab_lifecycle_smoke.gd \
            tests/p0_interactive_lab_smoke.gd \
            tests/lifecycle_actor_provider_transition_probe.gd \
            tests/lifecycle_shared_topology_split_probe.gd \
            tests/g3_frame_challenger.gd \
            tests/topology_rebased_split_probe.gd \
            tests/topology_lineage_probe.gd \
            tests/topology_binding_transaction_probe.gd \
            tests/multiframe_pin_joint_probe.gd \
            tests/multiframe_actor_joint_probe.gd \
            tests/multiframe_live_mutation_joint_probe.gd \
            tests/multiframe_joint_split_succession_probe.gd \
            tests/multiframe_multi_anchor_split_partition_probe.gd \
            tests/multiframe_anchor_destruction_probe.gd \
            tests/multiframe_mixed_anchor_split_probe.gd \
            tests/multiframe_merge_graph_contraction_probe.gd \
            tests/multiframe_hinge_split_succession_probe.gd \
            tests/multiframe_hinge_motor_limit_succession_probe.gd \
            tests/multiframe_stateful_hinge_partition_probe.gd \
            tests/multiframe_stateful_hinge_contraction_probe.gd
          do
            bash ci/run_godot_clean.sh "res://$script"
          done

  research-validation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Strict import / compile gate
        run: bash ci/run_godot_import.sh

      - name: Run full historical research campaign
        run: |
          set -e
          for script in \
            tests/g0_smoke.gd \
            tests/g0_campaign.gd \
            tests/g1_dynamic_construct.gd \
            tests/g1_campaign.gd \
            tests/g2_live_mutation.gd \
            tests/g2_campaign.gd \
            tests/lifecycle_freeze_semantics_probe.gd \
            tests/lifecycle_provider_replacement_probe.gd \
            tests/lab_lifecycle_smoke.gd \
            tests/p0_interactive_lab_smoke.gd \
            tests/lifecycle_actor_provider_transition_probe.gd \
            tests/lifecycle_shared_topology_split_probe.gd \
            tests/g3_baseline_probe.gd \
            tests/g3_dynamic_contact_probe.gd \
            tests/g3_frame_challenger.gd \
            tests/g3_frame_campaign.gd \
            tests/topology_split_probe.gd \
            tests/topology_actor_split_probe.gd \
            tests/topology_rebased_split_probe.gd \
            tests/topology_compatible_merge_probe.gd \
            tests/matter_mass_properties_probe.gd \
            tests/topology_inelastic_merge_probe.gd \
            tests/topology_free_split_divergence_probe.gd \
            tests/topology_actor_inelastic_merge_probe.gd \
            tests/topology_roundtrip_campaign.gd \
            tests/rigid_replacement_timing_probe.gd \
            tests/rigid_creation_lifecycle_probe.gd \
            tests/topology_lineage_probe.gd \
            tests/topology_lineage_campaign.gd \
            tests/topology_binding_policy_probe.gd \
            tests/topology_binding_transaction_probe.gd \
            tests/multiframe_pin_joint_probe.gd \
            tests/multiframe_actor_joint_probe.gd \
            tests/multiframe_live_mutation_joint_probe.gd \
            tests/multiframe_joint_split_succession_probe.gd \
            tests/multiframe_multi_anchor_split_partition_probe.gd \
            tests/multiframe_anchor_destruction_probe.gd \
            tests/multiframe_mixed_anchor_split_probe.gd \
            tests/multiframe_merge_graph_contraction_probe.gd \
            tests/multiframe_hinge_split_succession_probe.gd \
            tests/multiframe_hinge_motor_limit_succession_probe.gd \
            tests/multiframe_stateful_hinge_partition_probe.gd \
            tests/multiframe_stateful_hinge_contraction_probe.gd \
            tests/r0_representation_scale_baseline.gd \
            tests/r1_collision_aggregation_challenger.gd \
            tests/r1_merged_lifecycle_integration_probe.gd \
            tests/r2p_post_aggregation_profile.gd \
            tests/r2a_derived_region_locality_challenger.gd
          do
            bash ci/run_godot_clean.sh "res://$script"
          done
