name: P1 G4 camera evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "p1/**"
      - "actor/**"
      - "matter/**"
      - "construct/**"
      - "space/**"
      - "tests/p1_camera_visual_capture.gd"
      - "ci/run_godot_camera_capture.ps1"
      - "project.godot"
      - ".github/workflows/p1-camera-evidence.yml"
  workflow_dispatch:

concurrency:
  group: p1-g4-camera-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-forward-plus-camera:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant: [canonical, guarded_context, adaptive_relational]
    env:
      P1_CAMERA_EVIDENCE_DIR: ${{ github.workspace }}\artifacts\p1-camera-evidence\${{ matrix.variant }}
      P1_CAMERA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      P1_CAMERA_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.P1_CAMERA_SOURCE_SHA }}

      - name: Verify exact source checkout
        shell: pwsh
        run: |
          $checkedOut = (git rev-parse HEAD).Trim()
          if ($checkedOut -ne $env:P1_CAMERA_SOURCE_SHA) {
            throw "G4 evidence checkout mismatch: expected $env:P1_CAMERA_SOURCE_SHA, got $checkedOut"
          }
          "G4 exact source checkout: $checkedOut"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Strict synchronous project import
        shell: pwsh
        run: ./ci/run_godot_import.ps1

      - name: Capture G4 camera stress sequence
        shell: pwsh
        run: ./ci/run_godot_camera_capture.ps1 -OutputDir $env:P1_CAMERA_EVIDENCE_DIR

      - name: Record G4 evidence provenance
        shell: pwsh
        run: |
          $checkedOut = (git rev-parse HEAD).Trim()
          @"
          FrameMatter P1 G4 camera evidence
          workflow_run=$env:GITHUB_RUN_ID
          source_commit=$env:P1_CAMERA_SOURCE_SHA
          checked_out_commit=$checkedOut
          event_commit=$env:GITHUB_SHA
          platform=windows-latest
          renderer=Godot 4.7.2 Forward+ / D3D12
          source_scene=res://p1/main.tscn
          capture_script=res://tests/p1_camera_visual_capture.gd
          camera_policy=$env:P1_CAMERA_VARIANT
          "@ | Set-Content -Path (Join-Path $env:P1_CAMERA_EVIDENCE_DIR "CAMERA-EVIDENCE-INFO.txt")

      - name: Upload G4 camera evidence
        uses: actions/upload-artifact@v4
        with:
          name: FrameMatter-P1-G4-Camera-Evidence-Windows-${{ matrix.variant }}
          path: artifacts/p1-camera-evidence/${{ matrix.variant }}
          retention-days: 30
