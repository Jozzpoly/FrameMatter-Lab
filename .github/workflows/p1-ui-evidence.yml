name: P1 UI hierarchy evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "p1/**"
      - "matter/**"
      - "construct/**"
      - "actor/**"
      - "space/**"
      - "tests/p1_ui_visual_capture.gd"
      - "ci/run_godot_ui_capture.ps1"
      - "project.godot"
      - ".github/workflows/p1-ui-evidence.yml"
  workflow_dispatch:

concurrency:
  group: p1-ui-hierarchy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-forward-plus-ui:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, compact]
    env:
      P1_UI_VARIANT: ${{ matrix.variant }}
      P1_UI_EVIDENCE_DIR: ${{ github.workspace }}\artifacts\p1-ui-evidence\${{ matrix.variant }}
      P1_UI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.P1_UI_SOURCE_SHA }}

      - name: Verify exact source checkout
        shell: pwsh
        run: |
          $checkedOut = (git rev-parse HEAD).Trim()
          if ($checkedOut -ne $env:P1_UI_SOURCE_SHA) {
            throw "UI evidence checkout mismatch: expected $env:P1_UI_SOURCE_SHA, got $checkedOut"
          }
          "UI exact source checkout: $checkedOut"
          "UI hierarchy variant: $env:P1_UI_VARIANT"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Strict synchronous project import
        shell: pwsh
        run: ./ci/run_godot_import.ps1

      - name: Capture UI hierarchy evidence
        shell: pwsh
        run: ./ci/run_godot_ui_capture.ps1 -OutputDir $env:P1_UI_EVIDENCE_DIR

      - name: Record UI evidence provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:P1_UI_EVIDENCE_DIR | Out-Null
          $checkedOut = (git rev-parse HEAD).Trim()
          @"
          FrameMatter P1 UI hierarchy evidence
          workflow_run=$env:GITHUB_RUN_ID
          source_commit=$env:P1_UI_SOURCE_SHA
          checked_out_commit=$checkedOut
          event_commit=$env:GITHUB_SHA
          platform=windows-latest
          renderer=Godot 4.7.2 Forward+ / D3D12
          source_scene=res://p1/main.tscn
          capture_script=res://tests/p1_ui_visual_capture.gd
          ui_variant=$env:P1_UI_VARIANT
          evidence_scope=default static / zero-motion release / finite motion / topology split
          "@ | Set-Content -Path (Join-Path $env:P1_UI_EVIDENCE_DIR "UI-EVIDENCE-INFO.txt")

      - name: Upload UI hierarchy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameMatter-P1-UI-Evidence-Windows-${{ matrix.variant }}
          path: artifacts/p1-ui-evidence/${{ matrix.variant }}
          retention-days: 30
          if-no-files-found: warn
