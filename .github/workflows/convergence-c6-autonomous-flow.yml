name: Convergence C6 autonomous flow

on:
  push:
    branches:
      - research/convergence-c6-autonomous-flow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convergence-c6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomous-flow:
    name: Qualify C6 integrated flow
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      SOURCE_SHA: ${{ github.sha }}
      OUTPUT_DIR: artifacts/convergence-c6

    steps:
      - name: Checkout exact C6 source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Prove exact source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "C6 checkout mismatch: expected $env:SOURCE_SHA, got $actual" }
          "C6_SOURCE_PASS: $actual"

      - name: Setup Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Strict Windows import
        shell: pwsh
        run: ./ci/run_godot_import.ps1

      - name: Compile recovery dependency graph
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/p1_compile_gate.gd -PassMarker P1_COMPILE_GATE_PASS

      - name: Preserve C2 structural law
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/c2_structural_law_probe.gd -PassMarker C2_STRUCTURAL_LAW_PASS

      - name: Preserve C3 authority composition
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/c3_authority_composition_probe.gd -PassMarker C3_AUTHORITY_COMPOSITION_PASS

      - name: Preserve C4 passive relation
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/c4_passive_relation_probe.gd -PassMarker C4_PASSIVE_RELATION_PASS

      - name: Preserve C5A relation history
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/c5a_relation_history_probe.gd -PassMarker C5A_RELATION_HISTORY_PASS

      - name: Preserve C5B relation succession
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/c5b_relation_succession_probe.gd -PassMarker C5B_RELATION_SUCCESSION_PASS

      - name: Qualify real-scene C6 runtime composition
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/c6_runtime_flow_probe.gd -PassMarker C6_RUNTIME_FLOW_PASS

      - name: Qualify rendered production pointer + H input
        shell: pwsh
        run: ./ci/run_godot_c6_pointer_capture.ps1 -OutputDir "$env:OUTPUT_DIR/interaction"

      - name: Preserve source-level causal Spark
        shell: pwsh
        run: ./ci/run_godot_probe.ps1 -ScriptPath res://tests/w0d_recovery_causal_loop_probe.gd -PassMarker W0D_RECOVERY_CAUSAL_LOOP_PASS

      - name: Export exact Windows C6 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUTPUT_DIR | Out-Null
          $godotExecutable = (Get-Command godot -ErrorAction Stop).Source
          $outputPath = "$env:OUTPUT_DIR/FrameMatter-Convergence-C6.exe"
          $stdoutFile = [System.IO.Path]::GetTempFileName()
          $stderrFile = [System.IO.Path]::GetTempFileName()
          try {
            $argumentLine = "--headless --path . --export-release `"Windows Desktop`" `"$outputPath`""
            $process = Start-Process -FilePath $godotExecutable -ArgumentList $argumentLine -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
            $stdout = Get-Content -Path $stdoutFile -Raw -ErrorAction SilentlyContinue
            $stderr = Get-Content -Path $stderrFile -Raw -ErrorAction SilentlyContinue
            Write-Host ($stdout + [Environment]::NewLine + $stderr)
            if ($process.ExitCode -ne 0) { throw "Godot C6 export exited with status $($process.ExitCode)" }
          }
          finally {
            Remove-Item -Path $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $outputPath)) { throw "C6 executable missing after export: $outputPath" }
          if ((Get-Item $outputPath).Length -lt 1000000) { throw "C6 executable is implausibly small" }

      - name: Qualify autonomous C6 flow inside exact rendered executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:OUTPUT_DIR "FrameMatter-Convergence-C6.exe"
          $evidenceDir = Join-Path $env:OUTPUT_DIR "exported-evidence"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $env:C6_EXPORTED_EVIDENCE_DIR = (Resolve-Path $evidenceDir).Path
          $stdoutFile = [System.IO.Path]::GetTempFileName()
          $stderrFile = [System.IO.Path]::GetTempFileName()
          try {
            $process = Start-Process `
              -FilePath $exe `
              -ArgumentList @(
                "--audio-driver", "Dummy",
                "--rendering-method", "forward_plus",
                "--rendering-driver", "d3d12",
                "--", "--c6-autonomous-flow"
              ) `
              -NoNewWindow `
              -Wait `
              -PassThru `
              -RedirectStandardOutput $stdoutFile `
              -RedirectStandardError $stderrFile
            $stdout = Get-Content -Path $stdoutFile -Raw -ErrorAction SilentlyContinue
            $stderr = Get-Content -Path $stderrFile -Raw -ErrorAction SilentlyContinue
            $combined = $stdout + [Environment]::NewLine + $stderr
            Write-Host $combined
            if ($process.ExitCode -ne 0) { throw "Exact rendered C6 executable failed autonomous flow with status $($process.ExitCode)" }
            if ($combined -match '(?m)^ERROR:|SCRIPT ERROR:|Parse Error:|Compile Error:|C6_EXPORTED_AUTONOMOUS_FLOW_FAIL') {
              throw "Exact rendered C6 executable emitted an engine/script/failure error"
            }
            if ($combined -notmatch "C6_EXPORTED_AUTONOMOUS_FLOW_PASS") {
              throw "Exact rendered C6 executable did not emit autonomous-flow PASS"
            }
            if ($combined -notmatch "D3D12" -or $combined -notmatch "Forward\+") {
              throw "Exact rendered C6 executable did not prove D3D12 Forward+"
            }
          }
          finally {
            Remove-Item -Path $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          }
          foreach ($name in @(
            "00_exported_seam_target.png",
            "01_exported_relation_live.png",
            "02_exported_relation_history.png"
          )) {
            if (-not (Test-Path (Join-Path $evidenceDir $name))) {
              throw "Exact C6 exported evidence missing: $name"
            }
          }

      - name: Re-prove C0 Spark in exact C6 executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:OUTPUT_DIR "FrameMatter-Convergence-C6.exe"
          $stdoutFile = [System.IO.Path]::GetTempFileName()
          $stderrFile = [System.IO.Path]::GetTempFileName()
          try {
            $process = Start-Process -FilePath $exe -ArgumentList "--headless -- --c0-artifact-baseline" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
            $combined = (Get-Content -Path $stdoutFile -Raw -ErrorAction SilentlyContinue) + [Environment]::NewLine + (Get-Content -Path $stderrFile -Raw -ErrorAction SilentlyContinue)
            Write-Host $combined
            if ($process.ExitCode -ne 0) { throw "Exact C6 executable failed C0 qualification with status $($process.ExitCode)" }
            if ($combined -notmatch "C0_EXPORTED_SPARK_BASELINE_PASS") { throw "Exact C6 executable did not preserve C0 PASS" }
          }
          finally {
            Remove-Item -Path $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          }

      - name: Record C6 artifact digest
        shell: pwsh
        run: |
          $exe = Join-Path $env:OUTPUT_DIR "FrameMatter-Convergence-C6.exe"
          $digest = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "C6_EXACT_ARTIFACT_SHA256: $digest"

      - name: Record C6 provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUTPUT_DIR | Out-Null
          $checkedOut = (git rev-parse HEAD).Trim()
          @"
          FrameMatter Convergence C6 autonomous qualification
          workflow_run=$env:GITHUB_RUN_ID
          source_commit=$env:SOURCE_SHA
          checked_out_commit=$checkedOut
          platform=windows-latest
          engine=Godot 4.7.2
          renderer=Forward+ / D3D12
          owner_scene=res://p1/recovery_main.tscn
          owner_input=pointer + H structural seam
          semantic_chain=C2 structural law -> C3 authority composition -> C4 passive relation -> C5 living history
          exact_artifact_flow=--c6-autonomous-flow
          protected_baseline=--c0-artifact-baseline
          "@ | Set-Content -Path (Join-Path $env:OUTPUT_DIR "C6-PROVENANCE.txt")

      - name: Upload exact C6 Owner artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrameMatter-Convergence-C6-Windows
          path: |
            artifacts/convergence-c6/FrameMatter-Convergence-C6.exe
            artifacts/convergence-c6/C6-PROVENANCE.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload C6 rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameMatter-Convergence-C6-Rendered-Evidence
          path: |
            artifacts/convergence-c6/interaction
            artifacts/convergence-c6/exported-evidence
            artifacts/convergence-c6/C6-PROVENANCE.txt
          retention-days: 30
          if-no-files-found: warn
