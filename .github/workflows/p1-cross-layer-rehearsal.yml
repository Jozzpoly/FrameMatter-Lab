name: P1 cross-layer visible rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - "p1/**"
      - "matter/**"
      - "construct/**"
      - "actor/**"
      - "space/**"
      - "tests/p1_cross_layer_rehearsal_capture.gd"
      - "ci/run_godot_cross_layer_rehearsal.ps1"
      - "project.godot"
      - ".github/workflows/p1-cross-layer-rehearsal.yml"
  workflow_dispatch:

concurrency:
  group: p1-cross-layer-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-forward-plus-cross-layer:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      P1_CROSS_LAYER_EVIDENCE_DIR: ${{ github.workspace }}\artifacts\p1-cross-layer-rehearsal
      P1_CROSS_LAYER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.P1_CROSS_LAYER_SOURCE_SHA }}

      - name: Verify exact source checkout
        shell: pwsh
        run: |
          $checkedOut = (git rev-parse HEAD).Trim()
          if ($checkedOut -ne $env:P1_CROSS_LAYER_SOURCE_SHA) {
            throw "Cross-layer evidence checkout mismatch: expected $env:P1_CROSS_LAYER_SOURCE_SHA, got $checkedOut"
          }
          "Cross-layer exact source checkout: $checkedOut"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Strict synchronous project import
        shell: pwsh
        run: ./ci/run_godot_import.ps1

      - name: Capture cross-layer visible rehearsal
        shell: pwsh
        run: ./ci/run_godot_cross_layer_rehearsal.ps1 -OutputDir $env:P1_CROSS_LAYER_EVIDENCE_DIR

      - name: Record cross-layer evidence provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:P1_CROSS_LAYER_EVIDENCE_DIR | Out-Null
          $checkedOut = (git rev-parse HEAD).Trim()
          @"
          FrameMatter P1 cross-layer visible rehearsal
          workflow_run=$env:GITHUB_RUN_ID
          source_commit=$env:P1_CROSS_LAYER_SOURCE_SHA
          checked_out_commit=$checkedOut
          event_commit=$env:GITHUB_SHA
          platform=windows-latest
          renderer=Godot 4.7.2 Forward+ / D3D12
          source_scene=res://p1/main.tscn
          capture_script=res://tests/p1_cross_layer_rehearsal_capture.gd
          evidence_scope=pointer edit / zero-launch release / finite motion / moving edit+storage rebase / topology split / sibling-only motion / successor freeze
          "@ | Set-Content -Path (Join-Path $env:P1_CROSS_LAYER_EVIDENCE_DIR "CROSS-LAYER-EVIDENCE-INFO.txt")

      - name: Upload cross-layer rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameMatter-P1-Cross-Layer-Rehearsal-Windows
          path: artifacts/p1-cross-layer-rehearsal
          retention-days: 30
          if-no-files-found: warn
